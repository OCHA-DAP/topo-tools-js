name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [py-docs-updated]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OCHA-DAP/topo-tools-py
          path: topo-tools-py
          fetch-depth: 0
          sparse-checkout: |
            docs/pages
            plugins
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PY_DOCS_DIR: topo-tools-py/docs/pages
      - name: Build git-free plugin archive
        working-directory: topo-tools-py
        run: |
          set -euo pipefail
          mtime="$(git log -1 --format=%ct HEAD -- plugins/topo-tools)"
          git archive --format=zip \
            --mtime="@${mtime} +0000" \
            --prefix=topo-tools/ \
            -o ../dist/topo-tools-plugin.zip \
            HEAD:plugins/topo-tools
      - name: Generate marketplace manifest
        working-directory: topo-tools-py
        run: |
          set -euo pipefail
          sha256="$(sha256sum ../dist/topo-tools-plugin.zip | cut -d' ' -f1)"
          plugin_name="$(jq -r '.name' plugins/topo-tools/.claude-plugin/plugin.json)"
          plugin_description="$(jq -r '.description' plugins/topo-tools/.claude-plugin/plugin.json)"
          jq -n \
            --arg name "$plugin_name" \
            --arg description "$plugin_description" \
            --arg sha256 "$sha256" \
            '{
              name: "topo-tools",
              owner: { name: "OCHA-DAP" },
              plugins: [
                {
                  name: $name,
                  description: $description,
                  source: {
                    source: "archive",
                    url: "https://topo-tools.org/topo-tools-plugin.zip",
                    sha256: $sha256
                  }
                }
              ]
            }' > ../dist/marketplace.json
          jq empty ../dist/marketplace.json
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          lycheeVersion: v0.24.2
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
